name: release

on:
  push:
    branches: [main, alpha, beta]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: package install
        run: bun install --ignore-scripts --frozen-lockfile

      - name: build:dist
        run: bun run build:dist

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release

      # Trusted Publishing only allows staged publishes; approve on npmjs.com afterwards.
      # Also re-stages a version whose npm publish failed in a previous run.
      # ponytail: re-running while a version is staged but unapproved fails here; approve or reject it first.
      - name: Stage npm publish
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "eslint-plugin-export-component@$version" version >/dev/null 2>&1; then
            echo "$version already published"
          else
            npx -y npm@latest stage publish --tag "${{ github.ref_name == 'main' && 'latest' || github.ref_name }}"
          fi