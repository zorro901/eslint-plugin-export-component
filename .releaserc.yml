---
branches:
  - name: alpha
    channel: alpha
    prerelease: true
  - name: beta
    channel: beta
    prerelease: true
  - name: main
  - '+([0-9])?(.{+([0-9]),x}).x'

plugins:
  - "@semantic-release/commit-analyzer"
  - "@semantic-release/release-notes-generator"
  - - "@semantic-release/changelog"
    - changelogFile: CHANGELOG.md
  # npm publish is staged by the workflow (npm stage publish); this only bumps package.json
  - - "@semantic-release/npm"
    - npmPublish: false
  - - "@semantic-release/git"
    - assets:
        - CHANGELOG.md
        - package.json
  - "@semantic-release/github"
success: false
fail: false
tagFormat: "${version}"
